l(#ae09055)'/><path d='M800 669 L836 669' stroke='#e09055' stroke-width='1.6' fill='none' marker-end='url(#ae09055)'/><text x='1020' y='585' font-family="-apple-system,sans-serif" font-size='11' font-weight='600' fill='#d2726a'>no SMTP</text><text x='1020' y='601' font-family="-apple-system,sans-serif" font-size='10.5' fill='#8a8782'>nothing can</text><text x='1020' y='614' font-family="-apple-system,sans-serif" font-size='10.5' fill='#8a8782'>be sent</text><text x='40' y='772' font-family="-apple-system,sans-serif" font-size='12' font-weight='700' fill='#e9e7e2'>Three guarantees</text><circle cx='48' cy='792' r='3.5' fill='#4a9d6e'/><text x='62' y='796' font-family="-apple-system,sans-serif" font-size='11.5' fill='#8a8782'>Never marks mail read — readonly mailboxes, BODY.PEEK fetches, proved by check_readonly.py</text><circle cx='48' cy='813' r='3.5' fill='#4a9d6e'/><text x='62' y='817' font-family="-apple-system,sans-serif" font-size='11.5' fill='#8a8782'>Never sends — the drafting module holds no SMTP capability, and a test asserts it</text><circle cx='48' cy='834' r='3.5' fill='#4a9d6e'/><text x='62' y='838' font-family="-apple-system,sans-serif" font-size='11.5' fill='#8a8782'>Never loses mail — a capped run takes the oldest end and advances only past what it read</text></svg>
